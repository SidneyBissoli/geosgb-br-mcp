[project]
name = "geosgb-mcp"
version = "0.2.0"
description = "MCP connector para dados geológicos do Serviço Geológico do Brasil"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sidney"}
]
keywords = ["mcp", "geology", "brazil", "rare-earth", "mining"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    # Teto em 2: o SDK 2.x removeu `mcp.server.fastmcp` (FastMCP virou
    # MCPServer em `mcp.server.mcpserver`) e `pip install -e .` num ambiente
    # limpo resolvia 2.2.0 — o servidor não subia (medido em 2026-09-16).
    # Piso em 1.10: primeira versão com outputSchema/structuredContent.
    # Migrar para 2.x é item próprio; até lá, o pin.
    "mcp>=1.10.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # Contrato de saída: valida structuredContent contra o outputSchema
    # publicado com um validador INDEPENDENTE do SDK (tests/test_output_contract.py).
    "jsonschema>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geosgb_mcp"]

[project.scripts]
geosgb-mcp = "geosgb_mcp.server:mcp.run"
