[project]
name = "geosgb-mcp"
version = "0.4.0"
description = "MCP connector para dados geológicos do Serviço Geológico do Brasil"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sidney"}
]
keywords = ["mcp", "geology", "brazil", "rare-earth", "mining"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    # Linha 2.x desde 2026-09-17 (`MCPServer` em `mcp.server.mcpserver`;
    # o 1.x tinha `FastMCP` em `mcp.server.fastmcp`, removido no 2). Teto em
    # 3 porque o servidor toca API privada (`_tool_manager`, ver server.py)
    # e a troca de major já quebrou o import uma vez sem ninguém ver.
    "mcp>=2.0.0,<3",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # Contrato de saída: valida structuredContent contra o outputSchema
    # publicado com um validador INDEPENDENTE do SDK (tests/test_output_contract.py).
    "jsonschema>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geosgb_mcp"]

[project.scripts]
geosgb-mcp = "geosgb_mcp.server:mcp.run"
