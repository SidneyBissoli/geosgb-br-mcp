name: Integration tests (live GeoSGB portal)

# Contrato dos endpoints ArcGIS hardcoded (tests/test_endpoints_contract.py):
# cada caminho de ENDPOINTS precisa existir e ser a camada que o nome promete.
# Na ativação (2026-08-23), 2 dos 5 já estavam quebrados na fonte
# (litoestratigrafia_estados sem FeatureServer; sedimento_corrente com página
# de erro) — o workflow FALHA de propósito até o cliente migrar, e a falha
# vira pendência no painel do portfolio-monitor (workflow_watch).
# 2026-09-17: sedimento_corrente saiu do contrato (camada sem resultado
# analítico; ver constants.py) — ficam quatro endpoints vigiados.

on:
  # segunda 08:00 UTC = 05:00 BRT, antes da rodada semanal do monitor (09:00 BRT)
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  integration:
    # Roda no DESKTOP (executor próprio, rótulo desktop-br), não nos runners do
    # GitHub: medido em 27/10/2026, o IBGE recusa conexões vindas de fora do
    # Brasil (saída BR responde; EUA e Alemanha falham a conexão; a mesma saída
    # EUA alcança o BCB), e os runners do GitHub ficam nos EUA. Decisão do dono:
    # o GitHub agenda, repete e anota; só a execução vem para uma máquina no
    # Brasil, e vale para os seis servidores com contrato ao vivo, não só o ibge.
    # Instalação: portfolio-monitor/scripts/registrar-runners-desktop.ps1.
    # Desktop desligado: o job espera na fila até 24 h e, se ninguém o pegar,
    # termina sem sucesso — o painel acusa, como acusaria uma falha.
    runs-on: [self-hosted, desktop-br]
    # O executor é Windows; bash (do Git) mantém a semântica dos passos `run:`.
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # uv, e não actions/setup-python: no executor Windows o setup-python roda
      # o setup.ps1 da versão baixada pelo powershell.exe, e a política de
      # execução da máquina o recusa (1ª prova no desktop, 27/10/2026). O uv
      # baixa um Python pronto, sem script de instalação, e cria o venv já
      # ativado para os passos seguintes.
      - name: Setup uv + Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
          activate-environment: true

      - name: Install package + pytest
        run: uv pip install -e . pytest

      - name: Endpoints contract against live GeoSGB
        env:
          INTEGRATION_TESTS: '1'
        run: pytest tests/test_endpoints_contract.py -v
